# A push to master whose Cargo.toml version has no tag yet is a release (the
# version and the aci-tallies-geom pin under it are raised together, by hand or
# with `tools/release.sh X.Y.Z`; nobody types a tag; a Cargo.lock left behind
# is updated by the build). Tests
# run, wheels are built for every platform, then the Python package goes to
# PyPI, the crates to crates.io, and the GitHub release creates the tag vX.Y.Z
# on the commit built. Nothing is published unless every test and build
# passes. Pushes that keep a released version stop after `check`; run by hand
# (Actions, "Release", "Run workflow"), it only tests and builds.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

# One release at a time; a release in progress is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The version, and whether this run releases it: a push to master of a
  # version with no tag yet.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      build: ${{ steps.version.outputs.release == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from Cargo.toml, and whether it is new
        id: version
        shell: bash
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          [ -n "$version" ] || { echo "::error::no version in [workspace.package]"; exit 1; }
          grep -q "^aci-tallies-geom = .*version = \"=$version\"" Cargo.toml ||
            { echo "::error::Cargo.toml: set the aci-tallies-geom pin in [workspace.dependencies] to \"=$version\", as the version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "v$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/master ]; then
            echo "::notice::releasing v$version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is not released yet; a run by hand only builds it"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/ci.yml

  wheels:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64 }   # cross-compiled on Apple Silicon
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist

  sdist:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  crates-dry-run:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --workspace --dry-run

  publish-pypi:
    needs: [check, test, wheels, sdist, crates-dry-run]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # a re-run after a partial failure is safe

  publish-crates:
    needs: [check, test, wheels, sdist, crates-dry-run]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write  # crates.io trusted publishing
    env:
      # Only for the very first release: crates.io trusted publishing can be
      # set up only for crates that already exist. Delete the secret after.
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.CARGO_REGISTRY_TOKEN == ''
      # Publishes aci-tallies-geom, then aci-tallies (aci-tallies-py has publish = false).
      - run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || env.CARGO_REGISTRY_TOKEN }}

  # After both registries: it creates the tag vX.Y.Z on the commit that was
  # built, so a tag means the version is out.
  github-release:
    needs: [check, publish-pypi, publish-crates]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
